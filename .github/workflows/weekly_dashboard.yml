name: QART Weekly Report Auto Update

on:
  schedule:
    # 한국시간(KST) 월~금 오전 6시 35분 예약 -> 지연 감안하여 매일 아침 7시 전후 실행 완료
    # (UTC 기준 일~목 밤 21시 35분)
    - cron: '35 21 * * SUN-THU'
  workflow_dispatch: # 필요 시 깃허브 웹에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jira google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Run Weekly Script
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python weekly.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto update weekly report"
          git push
