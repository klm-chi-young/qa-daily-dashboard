name: QART Daily Dashboard Auto Update

on:
  schedule:
    # 📌 한국시간(KST) 월~금 오전 8시 50분 = UTC 일~목 밤 23시 50분
    - cron: '50 23 * * SUN-THU'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jira
          
      - name: Run Daily Script
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python daily.py
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto update daily dashboard"
          git push
